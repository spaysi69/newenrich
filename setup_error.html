<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Setup required · ColdIQ Lookup</title><style>body{font:16px/1.5 system-ui;background:#0a1020;color:#eff6ff;display:grid;place-items:center;min-height:100vh;padding:24px}.box{max-width:620px;padding:28px;border-radius:16px;border:1px solid #34415c;background:#111a2d}code{color:#c7d2fe}</style></head><body><main class="box"><h1>One-time setup needed</h1><p>Set these environment variables in your hosting dashboard, then redeploy:</p><p><code>APP_PASSWORD</code> — password for this app<br><code>COLDIQ_API_KEY</code> — your ColdIQ API key<br><code>SESSION_SECRET</code> — a long random value used to sign login sessions</p><p>The app deliberately stays locked until <code>APP_PASSWORD</code> is set.</p></main></body></html>
